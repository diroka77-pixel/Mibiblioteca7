name: Validar seguridad Android
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Inicializar CodeQL para Kotlin
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Ejecutar pruebas y compilar para el análisis
        run: gradle clean :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Analizar código y publicar resultados
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-validacion
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
