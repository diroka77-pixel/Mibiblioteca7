name: Compilar APK de prueba del rediseño
on:
  push:
    branches: [redisenio-biblioteca-096]
    paths:
      - '.github/workflows/build-redesign-test.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Probar y compilar APK de prueba
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MiBiblioteca-redisenio-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
