name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MiBiblioteca-v0.13-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiBiblioteca-v0.13.apk
          gh release view v0.13 >/dev/null 2>&1 || gh release create v0.13 --title "MiBiblioteca v0.13" --notes "APK de prueba para Android."
          gh release upload v0.13 MiBiblioteca-v0.13.apk --clobber
