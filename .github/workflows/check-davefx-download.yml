name: Verificar descarga Davefx
on:
  push:
    branches: [codex/sync-backup-davefx-fix]
    paths:
      - '.github/workflows/check-davefx-download.yml'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Identificar URL de Davefx
        run: |
          curl --fail --location --max-time 60 'https://k2-fsa.github.io/sherpa/onnx/tts/apk-engine.html' -o index.html
          python3 - <<'PY'
          html=open("index.html").read()
          needle="arm64-v8a-spa-tts-engine-vits-piper-es_ES-davefx-medium.apk"
          index=html.find(needle)
          print("INDEX", index)
          print(html[max(index-800,0):index+len(needle)+400])
          PY
