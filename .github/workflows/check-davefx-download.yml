name: Verificar descarga Davefx
on:
  push:
    branches: [codex/sync-backup-davefx-fix]
    paths:
      - '.github/workflows/check-davefx-download.yml'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar y verificar APK oficial
        run: |
          curl --fail --location --retry 2 --max-time 240 \
            'https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/84b121c256db85d6ebe0015705e647c36f489bc1/tts-engine-new/1.13.1/sherpa-onnx-1.13.1-arm64-v8a-es-tts-engine-vits-piper-es_ES-davefx-medium.apk' \
            -o Davefx.apk
          echo '0c41a7ec529761b929e3ef24c588fcc4fe76803a021285d638d8cccb6f205f43  Davefx.apk' | sha256sum --check
