name: Verificar descarga Davefx
on:
  push:
    branches: [codex/sync-backup-davefx-fix]
    paths:
      - '.github/workflows/check-davefx-download.yml'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar motor oficial Davefx
        run: |
          curl --fail --location --retry 2 --max-time 240 \
            'https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/main/tts-engine-new/1.13.8/sherpa-onnx-1.13.8-arm64-v8a-spa-tts-engine-vits-piper-es_ES-davefx-medium.apk' \
            -o Davefx.apk
          sha256sum Davefx.apk
          file Davefx.apk
