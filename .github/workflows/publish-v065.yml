name: Publicar MiBiblioteca v0.65
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v065.yml'
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Publicar MiBiblioteca 0.65 en Releases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiBiblioteca-v0.65-firmada
          run-id: 37082858180
          github-token: ${{ github.token }}
      - name: Verificar APK exacta
        run: |
          test -f app-release.apk
          echo '50af62c764e31db22264f61252c9ff4732630f7921194e01db8bd5ced55f0048  app-release.apk' | sha256sum --check
          mv app-release.apk MiBiblioteca-v0.65.apk
      - name: Publicar release de pruebas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.65 MiBiblioteca-v0.65.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target bfb18294e8a1ad4e6b780451780959db71e1a4f2 \
            --title "MiBiblioteca v0.65" \
            --notes "Versión de prueba: navegación por deslizamiento, lectura en voz alta y apertura de EPUB locales."
