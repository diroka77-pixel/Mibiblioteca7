name: Publicar MiBiblioteca v0.76
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v067.yml'
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Publicar MiBiblioteca v0.76'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Instalar SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restaurar firma permanente
        env:
          KEYSTORE_B64: ${{ secrets.MIBIBLIOTECA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIBIBLIOTECA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mibiblioteca.p12"
          keytool -list -keystore "$RUNNER_TEMP/mibiblioteca.p12" -storepass:env KEYSTORE_PASSWORD -alias mibiblioteca >/dev/null
      - name: Probar y compilar APK firmada
        env:
          MIBIBLIOTECA_KEYSTORE_PATH: ${{ runner.temp }}/mibiblioteca.p12
          MIBIBLIOTECA_KEYSTORE_PASSWORD: ${{ secrets.MIBIBLIOTECA_KEYSTORE_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verificar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          cp "$APK" MiBiblioteca-v0.76.apk
          if gh release view v0.76 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.76" -f sha="$GITHUB_SHA" -F force=true
            gh release upload v0.76 MiBiblioteca-v0.76.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.76 MiBiblioteca-v0.76.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MiBiblioteca v0.76" \
              --notes "Mejoras del lector: cerrar el panel deslizando a la izquierda y acceso prioritario a Subrayar/Quitar subrayado y Diccionario. Versión Android 0.76.0. Incluye la interfaz de noticias más compacta y cambios acumulados sobre la versión 0.75."
          fi
      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/mibiblioteca.p12"
