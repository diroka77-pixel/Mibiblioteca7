name: Publicar MiBiblioteca v0.75
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v067.yml'
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Publicar MiBiblioteca v0.75'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restaurar firma permanente
        env:
          KEYSTORE_B64: ${{ secrets.MIBIBLIOTECA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIBIBLIOTECA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mibiblioteca.p12"
          keytool -list -keystore "$RUNNER_TEMP/mibiblioteca.p12" -storepass:env KEYSTORE_PASSWORD -alias mibiblioteca >/dev/null
      - name: Probar y compilar APK firmada
        env:
          MIBIBLIOTECA_KEYSTORE_PATH: ${{ runner.temp }}/mibiblioteca.p12
          MIBIBLIOTECA_KEYSTORE_PASSWORD: ${{ secrets.MIBIBLIOTECA_KEYSTORE_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verificar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          cp "$APK" MiBiblioteca-v0.75.apk
          gh release create v0.75 MiBiblioteca-v0.75.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MiBiblioteca v0.75" \
            --notes "Corrección de reanudación del lector por voz para continuar desde la palabra actual, menú de selección accesible de cinco acciones con alternancia para quitar subrayado, y ficha de diccionario actualizada. Incluye cambios acumulados sobre la 0.74."
      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/mibiblioteca.p12"
